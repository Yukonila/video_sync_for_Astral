<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 320px;
            padding: 14px;
            font-family: system-ui, sans-serif;
        }

        h3 {
            margin: 0 0 10px;
            font-size: 15px;
        }

        label {
            display: block;
            font-size: 12px;
            color: #555;
            margin-top: 10px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            margin-top: 4px;
            padding: 6px;
            font-size: 13px;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-top: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .primary {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .primary:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .status {
            font-size: 12px;
            margin-top: 12px;
            color: #666;
        }

        .hint {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
            line-height: 1.4;
        }

        .required {
            color: #dc2626;
        }
    </style>
</head>

<body>
    <h3>Video Sync</h3>

    <label>服务器地址 <span class="required">*</span></label>
    <input id="server" placeholder="ws://虚拟IP:3000/ws" required>
    <div class="hint">必填。填运行 Node.js 服务那台机器的 IP（如 Astral 虚拟 IP）和端口</div>

    <label>房间号 <span class="required">*</span></label>
    <input id="room" placeholder="输入房间号" required>
    <button id="generate">生成随机房间号</button>

    <button id="save" class="primary" disabled>连接</button>

    <div class="status" id="status">未连接</div>

    <script src="popup.js"></script>
</body>

</html>
